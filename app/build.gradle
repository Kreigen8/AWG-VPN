plugins { id 'com.android.application' }

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('.signing/signing.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'ru.routevpn.app'
    compileSdk 35
    sourceSets.main.assets.srcDir rootProject.file('vendor/licenses')
    defaultConfig {
        applicationId 'ru.routevpn.app'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '0.2.2-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', rootProject.file('.cache/robolectric-m2').absolutePath
            systemProperty 'user.home', rootProject.file('.cache/robolectric-home').absolutePath
            doFirst { rootProject.file('.cache/robolectric-home').mkdirs() }
        }
    }
    packaging {
        jniLibs.useLegacyPackaging = true
        resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
    }
    signingConfigs {
        if (releaseSigningFile.exists()) {
            localRelease {
                storeFile rootProject.file('.signing/routevpn-release.jks')
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningFile.exists()) { signingConfig signingConfigs.localRelease }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Align legacy JDK7/JDK8 bridge artifacts with the merged Kotlin standard library.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    implementation project(':tunnel')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.concurrent:concurrent-futures:1.1.0'
}
